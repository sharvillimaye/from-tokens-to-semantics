[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "superposition_timeline"
version = "0.0.1"
description = "Temporal analysis of polysemantic neurons"
authors = [
  { name = "team-aasa" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["superposition_timeline"]
include = ["pyproject.toml", "superposition_timeline/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["superposition_timeline"]
force-sort-within-sections = true

