[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "superposition_timeline"
version = "0.0.1"
description = "Temporal analysis of polysemantic neurons"
authors = [
  { name = "team-aasa" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"
dependencies = [
    "matplotlib>=3.10.3",
    "nnsight>=0.4.11",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "pytest>=8.4.1",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "transformer-lens>=2.15.4",
    "transformers>=4.54.0",
    "tokengrams>=0.3.3",
    "hdbscan>=0.8.40",
    "loguru>=0.7.3",
    "typer>=0.12.3",
    "datasets>=2.19.0",
    "nltk>=3.9.1",
    "cupy-cuda12x>=13.3.0; platform_system=='Linux'",
    "cupy>=13.3.0; platform_system=='Darwin'",
]

[tool.ruff]
line-length = 99
src = ["superposition_timeline"]
include = ["pyproject.toml", "superposition_timeline/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["superposition_timeline"]
force-sort-within-sections = true

