[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymized_submission"
version = "0.0.1"
description = "Research code for polysemanticity analyses (anonymized submission artifact)"
authors = [
  { name = "Anonymous" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"
dependencies = [
    # Core ML/AI libraries (used in codebase)
    "torch>=2.2",
    "transformers>=4.40",
    "nnsight>=0.4.11",

    # Data processing and analysis
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "datasets>=2.19",
    "pyarrow>=14",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # Utilities and tools
    "tqdm>=4.66",
    "loguru>=0.7",
    "requests>=2.31",

    # Hugging Face tooling
    "huggingface-hub>=0.20",

    # Tokengrams for n-gram indexing
    "tokengrams>=0.3.3",

    # Testing
    "pytest>=8.0",
]

[tool.ruff]
line-length = 99
src = [
  "scripts",
  "ngrams",
  "polytope",
  "neuron_embeddings",
  "jsd_polysemanticity"
]
include = [
  "pyproject.toml",
  "scripts/**/*.py",
  "ngrams/**/*.py",
  "polytope/**/*.py",
  "neuron_embeddings/**/*.py",
  "jsd_polysemanticity/**/*.py",
  "tests/**/*.py"
]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = [
  "scripts",
  "ngrams",
  "polytope",
  "neuron_embeddings",
  "jsd_polysemanticity"
]
force-sort-within-sections = true

[tool.setuptools.packages.find]
include = [
  "scripts",
  "scripts.*",
  "ngrams",
  "ngrams.*",
  "polytope",
  "polytope.*",
  "neuron_embeddings",
  "neuron_embeddings.*",
  "jsd_polysemanticity",
  "jsd_polysemanticity.*"
]
