# Frequency circuit tracing v2: per-layer frequency directions from probes,
# component-level (attn vs MLP) and per-neuron decomposition.
# Fixes the failed circuit_decomposition.py (fixed direction, norm growth).
# All 5 models, all 5 datasets. 1 GPU (inference + sklearn probes).
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-freq-circuit-tracing
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # --- Setup (fresh clone to pick up latest code) ---
          REPO_DIR=/data/ani/mechinterp/polytope-code-circuit
          rm -rf $REPO_DIR
          git clone --branch polytope-results --single-branch \
            https://github.com/sharvillimaye/from-tokens-to-semantics.git $REPO_DIR
          cd $REPO_DIR
          export PYTHONPATH=$REPO_DIR:$PYTHONPATH
          echo "=== Verifying module exists ==="
          ls -la scripts/interventions/frequency_circuit_tracing.py

          pip install transformers scipy pandas numpy torch scikit-learn > /dev/null 2>&1

          DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/legacy/filtered
          if [ ! -d "$DATASET_DIR" ]; then
            DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/filtered
          fi

          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
          fi

          OUTPUT_ROOT=/data/ani/mechinterp/runs/circuit_v2
          METRICS_ROOT=/data/ani/mechinterp/runs/participation_coverage

          # ============================================================
          # 1. Pythia-70m (6 layers, fast — ~5 min)
          # ============================================================
          echo "=========================================================="
          echo "  Pythia-70m frequency circuit tracing — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.frequency_circuit_tracing \
            --model EleutherAI/pythia-70m-deduped --revision step143000 \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --metrics-dir ${METRICS_ROOT}/pythia-70m \
            --output-dir ${OUTPUT_ROOT}/pythia-70m \
            --device cuda

          # ============================================================
          # 2. OLMo-1B (16 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  OLMo-1B frequency circuit tracing — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.frequency_circuit_tracing \
            --model allenai/OLMo-1B-hf --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --metrics-dir ${METRICS_ROOT}/olmo-1b \
            --output-dir ${OUTPUT_ROOT}/olmo-1b \
            --device cuda

          # ============================================================
          # 3. Pythia-6.9B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Pythia-6.9B frequency circuit tracing — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.frequency_circuit_tracing \
            --model EleutherAI/pythia-6.9b-deduped --revision step143000 \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --metrics-dir ${METRICS_ROOT}/pythia-6.9b \
            --output-dir ${OUTPUT_ROOT}/pythia-6.9b \
            --device cuda

          # ============================================================
          # 4. OLMo-7B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  OLMo-7B frequency circuit tracing — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.frequency_circuit_tracing \
            --model allenai/OLMo-7B-hf --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --metrics-dir ${METRICS_ROOT}/olmo-7b \
            --output-dir ${OUTPUT_ROOT}/olmo-7b \
            --device cuda

          # ============================================================
          # 5. Llama 3.1 8B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Llama 3.1 8B frequency circuit tracing — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.frequency_circuit_tracing \
            --model meta-llama/Llama-3.1-8B --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --metrics-dir ${METRICS_ROOT}/llama-3.1-8b \
            --output-dir ${OUTPUT_ROOT}/llama-3.1-8b \
            --device cuda

          echo ""
          echo "=========================================================="
          echo "  ALL DONE — $(date)"
          echo "=========================================================="
          find $OUTPUT_ROOT -name "*.csv" -o -name "*.json" | sort
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
