# Participation Coverage vs n_clusters — Step 1
# Recomputes neuron_metrics with participation coverage (paper's L1-normalized metric)
# using CACHED activations (no GPU needed), then merges with n_clusters data.
# Tests whether paper's claim (high participation coverage -> monosemantic) replicates.
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-participation-coverage
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # --- Setup ---
          REPO_DIR=/data/ani/mechinterp/polytope-code
          if [ -d "$REPO_DIR/.git" ]; then
            cd $REPO_DIR && git fetch origin && git checkout polytope-results && git pull origin polytope-results
          else
            rm -rf $REPO_DIR
            git clone --branch polytope-results --single-branch \
              https://github.com/sharvillimaye/from-tokens-to-semantics.git $REPO_DIR
          fi
          cd $REPO_DIR

          pip install transformers scipy pandas numpy torch 2>/dev/null

          DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/legacy/filtered
          if [ ! -d "$DATASET_DIR" ]; then
            DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/filtered
          fi

          RUNS_ROOT=/data/ani/mechinterp/runs
          OUTPUT_ROOT=${RUNS_ROOT}/participation_coverage

          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
          fi

          echo "=== Participation Coverage Experiment — $(date) ==="
          echo "  Goal: compute paper's L1-normalized metric, test against n_clusters"
          echo ""

          # For each model: reuse cached activations, pass n_clusters CSV
          # The updated coverage_affinity_experiment.py now computes participation_coverage

          # ============================================================
          # 1. Pythia-70m — step143000 only (matches n_clusters data)
          # ============================================================
          echo "=========================================================="
          echo "  MODEL: Pythia-70m — $(date)"
          echo "=========================================================="
          for ds in emotion medical legal scientific verb; do
            CACHED="${RUNS_ROOT}/coverage_affinity/pythia-70m/${ds}/activations_step143000.pkl"
            if [ ! -f "$CACHED" ]; then
              echo "  SKIP: no cached activations for pythia-70m/${ds}"
              continue
            fi
            echo "  Dataset: ${ds} (using cached activations)"
            python3 coverage_affinity_experiment.py \
              --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
              --model EleutherAI/pythia-70m-deduped \
              --revisions step143000 \
              --output-dir ${OUTPUT_ROOT}/pythia-70m/${ds} \
              --load-activations "${CACHED}" \
              --clusters ${RUNS_ROOT}/n_clusters/pythia-70m/n_clusters_step143000.csv \
              --device cpu
          done

          # ============================================================
          # 2. OLMo-1B — main revision
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  MODEL: OLMo-1B — $(date)"
          echo "=========================================================="
          for ds in emotion medical legal scientific verb; do
            CACHED="${RUNS_ROOT}/coverage_affinity/olmo-1b/${ds}/activations_main.pkl"
            if [ ! -f "$CACHED" ]; then
              echo "  SKIP: no cached activations for olmo-1b/${ds}"
              continue
            fi
            echo "  Dataset: ${ds} (using cached activations)"
            python3 coverage_affinity_experiment.py \
              --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
              --model allenai/OLMo-1B-hf \
              --revisions main \
              --output-dir ${OUTPUT_ROOT}/olmo-1b/${ds} \
              --load-activations "${CACHED}" \
              --clusters ${RUNS_ROOT}/n_clusters/olmo-1b/n_clusters.csv \
              --device cpu
          done

          # ============================================================
          # 3. Pythia-6.9B — step143000 (needs GPU — no cached step143000)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  MODEL: Pythia-6.9B — $(date)"
          echo "=========================================================="
          for ds in emotion medical legal scientific verb; do
            CACHED="${RUNS_ROOT}/coverage_affinity/pythia-6.9b/${ds}/activations_step143000.pkl"
            if [ -f "$CACHED" ]; then
              echo "  Dataset: ${ds} (using cached activations)"
              python3 coverage_affinity_experiment.py \
                --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
                --model EleutherAI/pythia-6.9b-deduped \
                --revisions step143000 \
                --output-dir ${OUTPUT_ROOT}/pythia-6.9b/${ds} \
                --load-activations "${CACHED}" \
                --clusters ${RUNS_ROOT}/n_clusters/pythia-6.9b/n_clusters_step143000.csv \
                --device cpu
            else
              echo "  Dataset: ${ds} (extracting activations — needs GPU)"
              python3 coverage_affinity_experiment.py \
                --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
                --model EleutherAI/pythia-6.9b-deduped \
                --revisions step143000 \
                --output-dir ${OUTPUT_ROOT}/pythia-6.9b/${ds} \
                --save-activations \
                --clusters ${RUNS_ROOT}/n_clusters/pythia-6.9b/n_clusters_step143000.csv \
                --device cuda
            fi
          done

          # ============================================================
          # 4. OLMo-7B — main revision (needs GPU — no cached data)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  MODEL: OLMo-7B — $(date)"
          echo "=========================================================="
          for ds in emotion medical legal scientific verb; do
            CACHED="${RUNS_ROOT}/coverage_affinity/olmo-7b/${ds}/activations_main.pkl"
            if [ -f "$CACHED" ]; then
              echo "  Dataset: ${ds} (using cached activations)"
              python3 coverage_affinity_experiment.py \
                --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
                --model allenai/OLMo-7B-hf \
                --revisions main \
                --output-dir ${OUTPUT_ROOT}/olmo-7b/${ds} \
                --load-activations "${CACHED}" \
                --clusters ${RUNS_ROOT}/n_clusters/olmo-7b/n_clusters.csv \
                --device cpu
            else
              echo "  Dataset: ${ds} (extracting activations — needs GPU)"
              python3 coverage_affinity_experiment.py \
                --dataset ${DATASET_DIR}/${ds}_ngrams_dedup_filtered.jsonl \
                --model allenai/OLMo-7B-hf \
                --revisions main \
                --output-dir ${OUTPUT_ROOT}/olmo-7b/${ds} \
                --save-activations \
                --clusters ${RUNS_ROOT}/n_clusters/olmo-7b/n_clusters.csv \
                --device cuda
            fi
          done

          # ============================================================
          # Summary
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  ALL DONE — $(date)"
          echo "=========================================================="
          echo ""
          echo "=== Results ==="
          find $OUTPUT_ROOT -name "*.csv" -o -name "*.json" | sort
          echo ""
          echo "=== Key results: participation_coverage vs n_clusters ==="
          for f in $(find $OUTPUT_ROOT -name "analysis.json" | sort); do
            echo "--- ${f} ---"
            printf '%s\n' \
              'import json, os' \
              'with open(os.environ["ANALYSIS_FILE"]) as fh:' \
              '    data = json.load(fh)' \
              'for entry in data:' \
              '    layer = entry.get("layer", "?")' \
              '    pc_nc = entry.get("spearman_participation_coverage_nclusters", {})' \
              '    bc_nc = entry.get("spearman_coverage_nclusters", {})' \
              '    rm_nc = entry.get("spearman_raw_mass_nclusters", {})' \
              '    deciles = entry.get("participation_coverage_decile_nclusters", [])' \
              '    if pc_nc:' \
              '        pc_r = pc_nc.get("r", 0)' \
              '        bc_r = bc_nc.get("r", 0)' \
              '        rm_r = rm_nc.get("r", 0)' \
              '        print(f"  L{layer:2d}  PC->nc r={pc_r:+.3f}  BC->nc r={bc_r:+.3f}  RM->nc r={rm_r:+.3f}")' \
              '        if deciles:' \
              '            d0 = deciles[0]' \
              '            d9 = deciles[-1]' \
              '            pc0 = d0["mean_participation_coverage"]' \
              '            nc0 = d0["mean_n_clusters"]' \
              '            mono0 = d0["pct_monosemantic"]' \
              '            pc9 = d9["mean_participation_coverage"]' \
              '            nc9 = d9["mean_n_clusters"]' \
              '            mono9 = d9["pct_monosemantic"]' \
              '            print(f"        decile0: PC={pc0:.4f} nc={nc0:.1f} mono={mono0:.1%}")' \
              '            print(f"        decile9: PC={pc9:.4f} nc={nc9:.1f} mono={mono9:.1%}")' \
            | ANALYSIS_FILE="$f" python3 - 2>/dev/null || echo "  (parse error)"
          done
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
