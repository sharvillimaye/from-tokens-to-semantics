# Safety Neuron Identification — Tulu 3 SFT vs DPO (faithful to Chen et al.)
# Compares MLP activations between SFT model (M1) and DPO model (M2) on safety prompts.
# Identifies top 5% neurons by change score, then merges with coverage/affinity
# results and runs statistical analysis.
# 1 GPU needed (~32GB for 2x 8B models in fp16). H100 80GB is plenty.
# Requires HF token at /data/ani/.hf_token.
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-safety-neuron-tulu3
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # --- Setup ---
          REPO_DIR=/data/ani/mechinterp/polytope-code
          if [ -d "$REPO_DIR/.git" ]; then
            cd $REPO_DIR && git fetch origin && git checkout polytope-results && git pull origin polytope-results
          else
            rm -rf $REPO_DIR
            git clone --branch polytope-results --single-branch \
              https://github.com/sharvillimaye/from-tokens-to-semantics.git $REPO_DIR
          fi
          cd $REPO_DIR

          pip install transformers scipy pandas numpy torch 2>/dev/null

          # HF token
          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
            echo "HF_TOKEN loaded"
          else
            echo "ERROR: /data/ani/.hf_token not found"
            exit 1
          fi

          # Use Llama-3.1 coverage/affinity results (same base architecture)
          COVERAGE_DIR=/data/ani/mechinterp/runs/llama31_coverage_affinity/llama-3.1-8b
          OUTPUT_DIR=/data/ani/mechinterp/runs/safety_neuron_tulu3

          # Verify coverage/affinity results exist
          echo "=== Checking coverage/affinity results ==="
          for ds in emotion medical legal scientific verb; do
            if [ -f "${COVERAGE_DIR}/${ds}/neuron_metrics.csv" ]; then
              echo "  Found: ${ds}"
            else
              echo "  MISSING: ${ds}"
            fi
          done

          # ============================================================
          # Run safety neuron identification + analysis
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Safety Neuron Identification (Tulu 3) — $(date)"
          echo "  M1 (SFT):  allenai/Llama-3.1-Tulu-3-8B-SFT"
          echo "  M2 (DPO):  allenai/Llama-3.1-Tulu-3-8B-DPO"
          echo "=========================================================="

          python3 safety_neuron_identification.py \
            --base-model allenai/Llama-3.1-Tulu-3-8B-SFT \
            --instruct-model allenai/Llama-3.1-Tulu-3-8B-DPO \
            --coverage-affinity-dir ${COVERAGE_DIR} \
            --output-dir ${OUTPUT_DIR} \
            --top-pct 0.05 \
            --include-benign \
            --device cuda

          echo ""
          echo "=========================================================="
          echo "  DONE — $(date)"
          echo "=========================================================="
          echo ""
          echo "=== Results ==="
          find $OUTPUT_DIR -type f | sort
          echo ""
          du -sh $OUTPUT_DIR
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
