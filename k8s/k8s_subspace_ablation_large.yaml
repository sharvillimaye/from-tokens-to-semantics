# Subspace ablation for large models: OLMo-7B and Llama-3.1-8B
# Completes the 5-model matrix (we already have 70M, 1B, 6.9B).
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-subspace-ablation-large
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          REPO_DIR=/data/ani/mechinterp/polytope-code-subspace-large
          rm -rf $REPO_DIR
          git clone --branch polytope-results --single-branch \
            https://github.com/sharvillimaye/from-tokens-to-semantics.git $REPO_DIR
          cd $REPO_DIR
          export PYTHONPATH=$REPO_DIR:$PYTHONPATH
          echo "=== Verifying module exists ==="
          ls -la scripts/interventions/subspace_ablation.py

          pip install transformers scipy pandas numpy torch scikit-learn > /dev/null 2>&1

          DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/legacy/filtered
          if [ ! -d "$DATASET_DIR" ]; then
            DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/filtered
          fi

          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
          fi

          OUTPUT_ROOT=/data/ani/mechinterp/runs/subspace_ablation

          # ============================================================
          # OLMo-7B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  OLMo-7B subspace ablation — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.subspace_ablation \
            --model allenai/OLMo-7B-hf --revision main \
            --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/olmo-7b \
            --ablate-layers 0,5,10,15,20,25,30,31 \
            --ranks 1,2,4,8 \
            --run-cumulative \
            --run-random-baseline \
            --device cuda

          # ============================================================
          # Llama-3.1-8B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Llama-3.1-8B subspace ablation — $(date)"
          echo "=========================================================="
          python3 -m scripts.interventions.subspace_ablation \
            --model meta-llama/Llama-3.1-8B --revision main \
            --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/llama-3.1-8b \
            --ablate-layers 0,5,10,15,20,25,30,31 \
            --ranks 1,2,4,8 \
            --run-cumulative \
            --run-random-baseline \
            --device cuda

          echo ""
          echo "=========================================================="
          echo "  ALL DONE — $(date)"
          echo "=========================================================="
          find $OUTPUT_ROOT -name "*.csv" -o -name "*.json" | sort
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
