# Circuit decomposition: frequency direction projections per component (attn vs MLP)
# THE central experiment — does MLP flip from writing to erasing frequency?
# All 5 models, all 5 datasets. 1 GPU (inference only).
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-circuit-decomp
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          rm -rf /root/.cache/huggingface 2>/dev/null || true

          REPO_DIR=/data/ani/mechinterp/polytope-code
          cd $REPO_DIR && git fetch origin && git checkout polytope-results && git checkout -- . && git pull origin polytope-results
          pip install transformers scipy pandas numpy torch 2>/dev/null

          DATASET_DIR=/data/ani/mechinterp/code/scaleJSD/dataset/legacy/filtered
          OUTPUT_ROOT=/data/ani/mechinterp/runs/circuit

          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
          fi

          # ============================================================
          # 1. Pythia-70m (6 layers, fast)
          # ============================================================
          echo "=========================================================="
          echo "  Pythia-70m circuit decomposition — $(date)"
          echo "=========================================================="
          python3 circuit_decomposition.py \
            --model EleutherAI/pythia-70m-deduped --revision step143000 \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/pythia-70m \
            --device cuda

          # ============================================================
          # 2. OLMo-1B (16 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  OLMo-1B circuit decomposition — $(date)"
          echo "=========================================================="
          python3 circuit_decomposition.py \
            --model allenai/OLMo-1B-hf --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/olmo-1b \
            --device cuda

          # ============================================================
          # 3. Pythia-6.9B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Pythia-6.9B circuit decomposition — $(date)"
          echo "=========================================================="
          python3 circuit_decomposition.py \
            --model EleutherAI/pythia-6.9b-deduped --revision step143000 \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/pythia-6.9b \
            --device cuda

          # ============================================================
          # 4. OLMo-7B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  OLMo-7B circuit decomposition — $(date)"
          echo "=========================================================="
          python3 circuit_decomposition.py \
            --model allenai/OLMo-7B-hf --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/olmo-7b \
            --device cuda

          # ============================================================
          # 5. Llama 3.1 8B (32 layers)
          # ============================================================
          echo ""
          echo "=========================================================="
          echo "  Llama 3.1 8B circuit decomposition — $(date)"
          echo "=========================================================="
          python3 circuit_decomposition.py \
            --model meta-llama/Llama-3.1-8B --revision main \
            --all-datasets --dataset-dir ${DATASET_DIR} \
            --output-dir ${OUTPUT_ROOT}/llama-3.1-8b \
            --device cuda

          echo ""
          echo "=========================================================="
          echo "  ALL DONE — $(date)"
          echo "=========================================================="
          find $OUTPUT_ROOT -name "*.csv" -o -name "*.json" | sort
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
