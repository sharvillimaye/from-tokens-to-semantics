          description: '{"high": "drought", "low": "aridity", "category": "phenomena"}'

  generated_attributes:
    # Extract high-frequency term from the seed
    - id: high_freq_ngram
      instruction_messages:
        - role: SYSTEM
          content: |
            Extract the high-frequency term from the JSON. Return ONLY the term, nothing else.
        - role: USER
          content: |
            Extract the "high" value from: {synonym_pair_seed.description}
            Return ONLY the term.

    # Extract low-frequency term from the seed
    - id: low_freq_ngram
      instruction_messages:
        - role: SYSTEM
          content: |
            Extract the low-frequency term from the JSON. Return ONLY the term, nothing else.
        - role: USER
          content: |
            Extract the "low" value from: {synonym_pair_seed.description}
            Return ONLY the term.

    # Extract category from the seed
    - id: category
      instruction_messages:
        - role: SYSTEM
          content: |
            Extract the category from the JSON. Return ONLY the category, nothing else.
        - role: USER
          content: |
            Extract the "category" value from: {synonym_pair_seed.description}
            Return ONLY the category.

    # Generate shared definition
    - id: shared_meaning
      instruction_messages:
        - role: SYSTEM
          content: |
            You are a scientific lexicographer. Provide a concise, accurate definition.
        - role: USER
          content: |
            Write a 10-20 word definition for the scientific term pair:
            - Common term: {high_freq_ngram}
            - Technical term: {low_freq_ngram}

            The definition must apply equally to BOTH terms.
            Return ONLY the definition.

    # Generate a simple sentence template with a placeholder
    - id: sentence_template
      instruction_messages:
        - role: SYSTEM
          content: |
            You are a science writer. Create a simple sentence with a placeholder for the scientific term.

            RULES:
            1. Write a natural, simple sentence (10-15 words)
            2. Use [TERM] as a placeholder where the scientific term should go
            3. The sentence should work equally well with either the common or technical term
            4. Keep the sentence structure simple so substitution is seamless
            5. Do NOT include both terms - just use [TERM] once
        - role: USER
          content: |
            Create a simple scientific sentence template using [TERM] as placeholder.
            The term being described: {high_freq_ngram} (also known as {low_freq_ngram})

            Examples of good templates:
            - "The scientist studied the [TERM] under controlled laboratory conditions."
            - "Changes in [TERM] can significantly affect the surrounding environment."
            - "The textbook explained how [TERM] plays a crucial role in nature."

            Return ONLY the sentence template with [TERM] placeholder.

    # Generate the common sentence by substitution
    - id: example_sentence_common
      instruction_messages:
        - role: SYSTEM
          content: |
            Replace [TERM] with the specified word. Return ONLY the completed sentence.
        - role: USER
          content: |
            Replace [TERM] with "{high_freq_ngram}" in this sentence:
            {sentence_template}

            Return ONLY the completed sentence.

    # Generate the technical sentence by substitution
    - id: example_sentence_technical
      instruction_messages:
        - role: SYSTEM
          content: |
            Replace [TERM] with the specified word. Return ONLY the completed sentence.
        - role: USER
          content: |
            Replace [TERM] with "{low_freq_ngram}" in this sentence:
            {sentence_template}

            Return ONLY the completed sentence.

  # Transform into final structured format
  transformed_attributes:
    - id: final_output
      transformation_strategy:
        type: CHAT
        chat_transform:
          messages:
            - role: USER
              content: |
                Create a JSON object:

                {{
                  "high_freq_term": "{high_freq_ngram}",
                  "low_freq_term": "{low_freq_ngram}",
                  "category": "{category}",
                  "definition": "{shared_meaning}",
                  "sentence_template": "{sentence_template}",
                  "example_common": "{example_sentence_common}",
                  "example_technical": "{example_sentence_technical}"
                }}

                Return ONLY the JSON object.

inference_config:
  model:
    model_name: claude-sonnet-4-5
  engine: ANTHROPIC
  generation:
    max_new_tokens: 256
    temperature: 0.3
  remote_params:
    num_workers: 50
    politeness_policy: 60
