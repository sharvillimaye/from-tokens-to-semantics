# Legal N-gram Synonym Dataset Generation
# Purpose: Generate high-frequency / low-frequency synonym pairs for JSD analysis
# Strategy: Use curated synonym pairs to ensure diversity and validity
strategy: GENERAL
num_samples: 200
output_path: ./data/legal_ngrams.jsonl

strategy_params:
  sampled_attributes:
    # Pre-defined verified synonym pairs to ensure diversity and correctness
    - id: synonym_pair_seed
      name: Synonym Pair
      description: A verified high-frequency / low-frequency legal synonym pair
      possible_values:
        # Crimes and Offenses
        - id: theft
          name: theft / larceny
          description: '{"high": "theft", "low": "larceny", "category": "crimes"}'
        - id: murder
          name: murder / homicide
          description: '{"high": "murder", "low": "homicide", "category": "crimes"}'
        - id: fraud
          name: fraud / misrepresentation
          description: '{"high": "fraud", "low": "misrepresentation", "category": "crimes"}'
        - id: assault
          name: assault / battery
          description: '{"high": "assault", "low": "battery", "category": "crimes"}'
        - id: robbery
          name: robbery / larceny by force
          description: '{"high": "robbery", "low": "larceny by force", "category": "crimes"}'
        - id: arson
          name: arson / incendiarism
          description: '{"high": "arson", "low": "incendiarism", "category": "crimes"}'
        - id: kidnapping
