# Emotions/Adjectives N-gram Synonym Dataset Generation
# Purpose: Generate high-frequency / low-frequency synonym pairs for JSD analysis
# Strategy: Use curated synonym pairs to ensure diversity and validity
strategy: GENERAL
num_samples: 200
output_path: ./data/emotion_ngrams.jsonl

