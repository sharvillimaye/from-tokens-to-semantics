          description: '{"high": "offended", "low": "affronted", "category": "social_emotions"}'
        - id: sympathetic
          name: sympathetic / compassionate
          description: '{"high": "sympathetic", "low": "compassionate", "category": "social_emotions"}'
        - id: awkward
          name: awkward / discomfited
          description: '{"high": "awkward", "low": "discomfited", "category": "social_emotions"}'
        - id: rejected
          name: rejected / spurned
          description: '{"high": "rejected", "low": "spurned", "category": "social_emotions"}'

        # Physical States
        - id: tired
          name: tired / fatigued
          description: '{"high": "tired", "low": "fatigued", "category": "physical_states"}'
        - id: hungry
          name: hungry / famished
          description: '{"high": "hungry", "low": "famished", "category": "physical_states"}'
        - id: sick
          name: sick / ailing
          description: '{"high": "sick", "low": "ailing", "category": "physical_states"}'
        - id: healthy
          name: healthy / robust
          description: '{"high": "healthy", "low": "robust", "category": "physical_states"}'
        - id: strong
          name: strong / vigorous
          description: '{"high": "strong", "low": "vigorous", "category": "physical_states"}'
        - id: weak
          name: weak / feeble
          description: '{"high": "weak", "low": "feeble", "category": "physical_states"}'
        - id: sleepy
          name: sleepy / drowsy
          description: '{"high": "sleepy", "low": "drowsy", "category": "physical_states"}'
        - id: thirsty
          name: thirsty / parched
          description: '{"high": "thirsty", "low": "parched", "category": "physical_states"}'
        - id: exhausted
          name: exhausted / depleted
          description: '{"high": "exhausted", "low": "depleted", "category": "physical_states"}'
        - id: energetic
          name: energetic / vivacious
          description: '{"high": "energetic", "low": "vivacious", "category": "physical_states"}'

        # Cognitive States
        - id: confused
          name: confused / bewildered
          description: '{"high": "confused", "low": "bewildered", "category": "cognitive_states"}'
        - id: curious
