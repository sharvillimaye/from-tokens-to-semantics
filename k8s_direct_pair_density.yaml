apiVersion: batch/v1
kind: Job
metadata:
  name: ani-direct-pair-density
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          cd /data/ani/mechinterp/code

          echo "=== Running direct pair density on polytope (real) ==="
          python3 -m polytope.direct_pair_density \
            --batch-dir /data/ani/mechinterp/runs/polytope \
            --output-dir /data/ani/mechinterp/runs/paper_results_v2/direct_pair_density_real

          echo ""
          echo "=== Running direct pair density on polytope_shuffled ==="
          python3 -m polytope.direct_pair_density \
            --batch-dir /data/ani/mechinterp/runs/polytope_shuffled \
            --output-dir /data/ani/mechinterp/runs/paper_results_v2/direct_pair_density_shuffled

          echo ""
          echo "=== Full pipeline (extraction + density) on emotion dataset ==="
          python3 -m polytope.polytope_pipeline \
            --dataset /data/ani/mechinterp/datasets/emotion_ngrams_filtered.jsonl \
            --model EleutherAI/pythia-70m-deduped \
            --revision step143000 \
            --output-dir /data/ani/mechinterp/runs/paper_results_v2/polytope_pipeline_emotion \
            --save-records

          echo ""
          echo "=== DONE ==="
        resources:
          requests:
            cpu: "8"
            memory: "32Gi"
            ephemeral-storage: "10Gi"
          limits:
            cpu: "16"
            memory: "64Gi"
            ephemeral-storage: "20Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
