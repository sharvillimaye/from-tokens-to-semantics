# Polytope Density — All models, all datasets
# Runs 6 models x 5 datasets = 30 combinations sequentially.
# Each model needs 1 GPU (inference only, fp16). Largest model (Llama 8B) uses ~16GB.
# Small models run first (fast), then large models.
apiVersion: batch/v1
kind: Job
metadata:
  name: ani-polytope-density-all
  namespace: oumi-science
spec:
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      restartPolicy: Never
      containers:
      - name: runner
        image: ghcr.io/oumi-ai/oumi:latest
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e

          # --- Setup ---
          # Clone fresh copy of the polytope-results branch alongside existing code
          REPO_DIR=/data/ani/mechinterp/polytope-code
          if [ -d "$REPO_DIR/.git" ]; then
            cd $REPO_DIR && git fetch origin && git checkout polytope-results && git pull origin polytope-results
          else
            rm -rf $REPO_DIR
            git clone --branch polytope-results --single-branch \
              https://github.com/sharvillimaye/from-tokens-to-semantics.git $REPO_DIR
          fi
          cd $REPO_DIR
          pip install nnsight loguru 2>/dev/null

          # Symlink datasets from the existing code directory
          ln -sfn /data/ani/mechinterp/code/scaleJSD $REPO_DIR/scaleJSD 2>/dev/null || true

          # HF token for gated models (Llama). Set via k8s secret or env var.
          export HF_TOKEN="${HF_TOKEN:-}"
          if [ -f /data/ani/.hf_token ]; then
            export HF_TOKEN=$(cat /data/ani/.hf_token)
          fi

          OUTPUT_ROOT=/data/ani/mechinterp/runs/polytope_density

          # --- List all combos ---
          echo "=== Planned runs ==="
          python3 -m polytope.run_all_polytope \
            --code-dir $REPO_DIR \
            --output-root $OUTPUT_ROOT \
            --list

          # --- Run small models first (fast) ---
          for MODEL in pythia-70m pythia-1b olmo-1b; do
            echo ""
            echo "=========================================================="
            echo "  MODEL: $MODEL — $(date)"
            echo "=========================================================="
            python3 -m polytope.run_all_polytope \
              --code-dir $REPO_DIR \
              --output-root $OUTPUT_ROOT \
              --model $MODEL
          done

          # --- Run large models ---
          for MODEL in pythia-6.9b olmo-7b llama-8b; do
            echo ""
            echo "=========================================================="
            echo "  MODEL: $MODEL — $(date)"
            echo "=========================================================="
            python3 -m polytope.run_all_polytope \
              --code-dir $REPO_DIR \
              --output-root $OUTPUT_ROOT \
              --model $MODEL
          done

          echo ""
          echo "=========================================================="
          echo "  ALL DONE — $(date)"
          echo "=========================================================="
          ls -la $OUTPUT_ROOT/*/
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "10Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "16"
            memory: "128Gi"
            ephemeral-storage: "40Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-oumi-science
